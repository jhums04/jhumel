# Runs every test suite on pull requests to develop and on pushes to develop.
# Third-party actions are pinned to a commit SHA (version in the comment) so a moved tag cannot change what runs.
name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

permissions:
  contents: read

# A new push to the same branch cancels the run it replaces.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin:
    name: Plugin and theme
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wordpress/plugins/quote-form
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # PHP 8.1 is the plugin's minimum (composer.json platform), so the lowest supported version is what gets tested.
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.1'
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Coding standards (PHPCS, WordPress rules)
        run: composer lint

      - name: Unit tests (PHPUnit)
        run: composer test

      - name: Theme PHP syntax
        working-directory: wordpress/themes/jhumel
        run: find . -name '*.php' -print0 | xargs -0 -n1 php -l

  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (oxlint, type-aware)
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Tests (Vitest)
        run: npm run test

      - name: Build
        run: npm run build

  database:
    name: Database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same CLI version as local development.
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 3.2.0

      # Starts a throwaway Postgres and applies every migration and the seed.
      - name: Start database
        run: supabase db start

      - name: Database tests (pgTAP)
        run: supabase test db

  workflows:
    name: n8n workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Exports are clean (valid, inactive, no personal or instance data)
        run: ./n8n/check-exports.sh
