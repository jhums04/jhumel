# Weekly dependency updates. Minor and patch updates arrive grouped in one pull request per ecosystem;
# each pull request runs through CI before it can be merged.
version: 2
updates:
  - package-ecosystem: npm
    directory: /dashboard
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: composer
    directory: /wordpress/plugins/quote-form
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
